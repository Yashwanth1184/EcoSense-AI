<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Biodiversity Intelligence AI</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f2f6f2;color:#17231a}
header{background:#173b2b;color:white;padding:42px 7%}h1{font-size:40px;margin:5px 0}
main{max-width:1100px;margin:28px auto;padding:0 18px}.card{background:white;border-radius:18px;padding:24px;margin-bottom:20px;box-shadow:0 6px 24px #173b2b12}
textarea,input{width:100%;padding:12px;border:1px solid #ccd8ce;border-radius:10px;margin-top:7px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}label{font-size:13px;font-weight:bold}
button{margin-top:18px;padding:13px 18px;border:0;border-radius:10px;background:#206b48;color:#fff;font-weight:bold;cursor:pointer}
.rec{border-left:5px solid #2d8056;padding:18px;margin:14px 0;background:#f7faf7;border-radius:12px}
.chip{display:inline-block;background:#e5f1e8;padding:6px 9px;border-radius:20px;margin:3px;font-size:12px}
.evidence{border-top:1px solid #e5e9e5;padding:12px 0}a{color:#1b6845}.hidden{display:none}
@media(max-width:800px){.grid{grid-template-columns:1fr}h1{font-size:30px}}
</style>
</head>
<body>
<header><div>AI-POWERED ENVIRONMENTAL SCIENCE</div><h1>🌿 Biodiversity Intelligence AI</h1><p>Evidence-grounded analysis of soil, biodiversity, climate, land use and human impact.</p></header>
<main>
<section class="card">
<h2>Ask about your ecosystem</h2>
<textarea id="question" rows="4" placeholder="Example: Biodiversity is declining on my land. Soil organic carbon is 0.3%, rainfall is low and I grow wheat."></textarea>
<h3>Structured context (optional)</h3>
<div class="grid">
<label>Soil pH<input id="ph" type="number" step="0.1"></label>
<label>Organic carbon %<input id="soc" type="number" step="0.01"></label>
<label>Soil moisture<input id="moisture" type="number"></label>
<label>Land use / crop<input id="land"></label>
<label>Region<input id="region"></label>
<label>Rainfall<input id="rainfall"></label>
<label>Temperature<input id="temperature" type="number"></label>
<label>Species richness<input id="species"></label>
<label>Habitat diversity<input id="habitat"></label>
<label>Pollution<input id="pollution"></label>
<label>Deforestation<input id="deforestation"></label>
<label>Latitude<input id="lat" type="number"></label>
<label>Longitude<input id="lon" type="number"></label>
</div>
<button onclick="analyze()">Analyze ecosystem</button>
</section>
<section id="output" class="card hidden"></section>
</main>
<script>
const v=id=>document.getElementById(id).value.trim(); const n=id=>v(id)===""?null:Number(v(id));
function payload(){return{
text:v("question")||null,
soil:{ph:n("ph"),organic_carbon:n("soc"),moisture:n("moisture")},
land:{use:v("land")||null,cover:null},
biodiversity:{species_richness:v("species")||null,habitat_diversity:v("habitat")||null},
climate:{temperature:n("temperature"),rainfall:v("rainfall")||null},
human_impact:{pollution:v("pollution")||null,deforestation:v("deforestation")||null},
region:v("region")||null,latitude:n("lat"),longitude:n("lon")}};
async function analyze(){
const out=document.getElementById("output");out.classList.remove("hidden");out.innerHTML="<p>🔬 Retrieving scientific evidence...</p>";
try{
const r=await fetch("/api/analyze",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload())});
const d=await r.json();
if(d.status==="needs_clarification"){out.innerHTML="<h2>More information needed</h2><p>"+d.clarifying_question+"</p>";return;}
let html="<h2>Environmental assessment</h2><p>"+(d.narrative||d.conversation_summary)+"</p>";
if(d.diagnosis?.length)html+="<h3>Diagnosis</h3><ul>"+d.diagnosis.map(x=>"<li>"+x+"</li>").join("")+"</ul>";
html+="<h2>Recommendations</h2>";
d.recommendations.forEach((r,i)=>{html+=`<div class="rec"><h3>${i+1}. ${r.action}</h3><p><b>Why it works:</b> ${r.why_it_works}</p><p><b>Impacted metrics:</b><br>${r.impacted_metrics.map(x=>`<span class="chip">${x}</span>`).join("")}</p><p><b>Time horizon:</b> ${r.time_horizon}</p><p><b>Confidence:</b> ${r.confidence}</p><p><b>Measurement:</b></p><ul>${r.measurement_plan.map(x=>`<li>${x}</li>`).join("")}</ul><h4>Scientific evidence</h4>${r.evidence.map(e=>`<div class="evidence"><b>${e.organization}: ${e.title}</b><p>${e.claim}</p><p>${e.mechanism}</p><a href="${e.source_url}" target="_blank">Source ↗</a></div>`).join("")}</div>`});
out.innerHTML=html;
}catch(e){out.innerHTML="<p>Backend not running. Start: uvicorn backend.main:app --reload</p>"}
}
</script>
</body>
</html>
